<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nami · Infinite Runner</title>
<style>
  :root{ --sage:#8fb996; --sage-d:#46704f; --clay:#b8643c; --cream:#fff6e3; --ink:#2b2a33; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#241f2a;color:var(--cream);
    font-family:"Avenir Next Rounded","Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  #hud.on{display:block}
  .hud-top{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:16px;padding-top:env(safe-area-inset-top,0)}
  .pill{background:rgba(36,31,42,.62);backdrop-filter:blur(4px);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap}
  #bar{flex:1;height:14px;background:rgba(36,31,42,.55);border-radius:999px;overflow:hidden;position:relative;border:2px solid rgba(255,246,227,.35)}
  #barfill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),#cfe8b0);border-radius:999px}
  #leaks{display:flex;gap:7px;align-items:center}
  #leaks i{width:18px;height:18px;border-radius:50%;border:3px solid #d9d1c0;background:transparent;transition:.2s}
  #leaks i.full{background:#e0483c;border-color:#e0483c;transform:scale(1.15)}
  .hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:14px;opacity:.85;padding-bottom:env(safe-area-inset-bottom,0)}
  .hint kbd{background:rgba(255,246,227,.16);border:1px solid rgba(255,246,227,.4);border-radius:6px;padding:2px 8px;margin:0 2px;font-family:inherit;font-weight:700}

  /* Título de nivel al empezar */
  #levelTitle{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0}
  #levelTitle.on{animation:lt 2.8s ease both}
  #levelTitle small{display:block;font-size:clamp(16px,3vw,24px);color:var(--sage);font-weight:700;margin-bottom:4px}
  #levelTitle b{font-size:clamp(28px,6vw,56px);text-shadow:0 4px 18px rgba(0,0,0,.6)}
  @keyframes lt{0%{opacity:0;transform:translateY(14px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

  /* Pantallas */
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;
    background:radial-gradient(ellipse at center,rgba(36,31,42,.55),rgba(24,20,30,.92))}
  .screen.on{display:flex}
  .screen h1{font-size:clamp(34px,7vw,68px);margin:0 0 6px;line-height:1.05;letter-spacing:-.02em;color:var(--cream)}
  .screen h1 small{display:block;font-size:.34em;letter-spacing:0;color:var(--sage);font-weight:700;margin-bottom:8px}
  .screen p{max-width:46ch;margin:8px auto;font-size:17px;line-height:1.5;color:#ece2cc}
  .btn{margin-top:20px;padding:14px 32px;border-radius:16px;border:0;background:var(--clay);color:#fff;font:inherit;font-weight:800;font-size:19px;
    cursor:pointer;box-shadow:0 5px 0 #7d3d20;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #7d3d20}
  .btn[disabled]{opacity:.5;cursor:wait}
  #levelPick{display:flex;gap:10px;margin-top:16px}
  .chip{padding:8px 18px;border-radius:999px;border:2px solid rgba(255,246,227,.4);background:transparent;color:var(--cream);font:inherit;font-weight:700;cursor:pointer}
  .chip.on{background:var(--sage);border-color:var(--sage);color:var(--ink)}
  .keys{margin-top:18px;display:grid;grid-template-columns:auto auto;gap:8px 16px;text-align:left;font-size:15px;color:#ece2cc}
  .keys kbd{background:rgba(255,246,227,.14);border:1px solid rgba(255,246,227,.4);border-radius:6px;padding:2px 9px;font-family:inherit;font-weight:700}
  #status{margin-top:18px;font-size:12.5px;opacity:.75;max-width:64ch;line-height:1.6}
  #status b{color:var(--sage)} #status s{color:#e8b25a;text-decoration:none}
  #lostReason{color:#ffb4a3;font-weight:700}

  /* Letrero de nivel completado */
  #banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;padding:20px;text-align:center}
  #banner.on{display:flex}
  #banner h2{margin:0;font-size:clamp(36px,8vw,84px);color:var(--cream);line-height:1.05;
    text-shadow:0 4px 0 var(--sage-d),0 10px 30px rgba(0,0,0,.5);animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
  #banner p{margin:14px 0 0;max-width:40ch;font-size:20px;font-weight:700;color:#d8ecd0;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:pop .7s .25s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{from{transform:scale(.3) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
  #flash.hit{background:radial-gradient(ellipse at center,transparent 30%,rgba(224,72,60,.55));opacity:1;transition:none}
  #flash.blue{background:radial-gradient(ellipse at center,rgba(150,180,255,.9),rgba(61,90,241,.35));opacity:1;transition:none}

  @media (prefers-reduced-motion:reduce){#banner h2,#banner p,#levelTitle.on{animation:none}#levelTitle.on{opacity:1}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>

<div id="hud">
  <div class="hud-top">
    <div class="pill">Aplastadas: <span id="kills">0</span></div>
    <div id="bar"><span id="barfill"></span></div>
    <div class="pill" id="timeTxt">30 s</div>
    <div class="pill" title="Bichos que llegaron hasta Nami"><span id="leaks"><i></i><i></i><i></i></span></div>
  </div>
  <div class="hint"><kbd>↑</kbd> saltar piedras &nbsp;·&nbsp; <kbd>Espacio</kbd> o clic: manotazo</div>
</div>

<div id="levelTitle"><small id="ltNum">Nivel 1</small><b id="ltName">La mesa</b></div>
<div id="banner"><h2 id="bannerTitle">¡Nivel 1 Completado!</h2><p id="bannerText"></p></div>
<div id="flash"></div>

<div class="screen on" id="screen">
  <h1 id="screenTitle"><small>Nami · Infinite Runner</small>Nami</h1>
  <p id="screenText">Cargando modelos…</p>
  <div id="levelPick" style="display:none">
    <button class="chip on" data-level="0">Nivel 1</button>
    <button class="chip" data-level="1">Nivel 2</button>
    <button class="chip" data-level="2">Nivel 3</button>
  </div>
  <div class="keys" id="keysBox" style="display:none">
    <kbd>↑</kbd><span>Saltar las piedras</span>
    <kbd>Espacio / clic</kbd><span>Manotazo a los bichos</span>
  </div>
  <p id="lostReason"></p>
  <button class="btn" id="startBtn" disabled>Cargando…</button>
  <div id="status"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

/* ═══════════════════════════════════════════════════════════════
   ▌ VARIABLES EDITABLES
   ═══════════════════════════════════════════════════════════════ */

// ⏱ Segundos que hay que sobrevivir en cada nivel antes del final
const SURVIVE_SECONDS_NIVEL_1 = 30;
const SURVIVE_SECONDS_NIVEL_2 = 30;
const SURVIVE_SECONDS_NIVEL_3 = 30;

// ⚙ Parámetros por nivel (velocidades en unidades/seg)
const NIVEL_1 = { ENEMY_SPEED: 7,  ROCK_SPEED: 7, SPAWN_MIN: 1.3, SPAWN_MAX: 2.3, ROCK_CHANCE: 0.4, MAX_LEAKS: 3 };
const NIVEL_2 = { ENEMY_SPEED: 11, ROCK_SPEED: 8, SPAWN_MIN: 1.0, SPAWN_MAX: 1.9, ROCK_CHANCE: 0.4, MAX_LEAKS: 3 };   // arañas más rápidas

// Nivel 3: caracoles lentos que aguantan 2 golpes. Lo que no pongas aquí (SPAWN_Z, ATTACK_RANGE...) usa el valor de CONFIG.
const NIVEL_3 = {
  ENEMY_SPEED: 3.5,        // caracoles: lentos
  ROCK_SPEED: 5,         // piedras (igual que los caracoles para que no se atraviesen)
  SPAWN_Z: -17,            // aparecen más cerca porque avanzan despacio
  SPAWN_MIN: 1.6, SPAWN_MAX: 2.6, ROCK_CHANCE: 0.35, MAX_LEAKS: 3,
  ENEMY_HITS: 2,           // golpes necesarios para eliminar un caracol
  KNOCKBACK: 1.0,          // cuánto retrocede un caracol al recibir el primer golpe
  ATTACK_RANGE: 3.6,       // alcance del manotazo (mayor para poder dar los 2 golpes)
};

// ⚙ Parámetros comunes
const CONFIG = {
  SURFACE_Y: 2.0,            // Altura (Y) de la superficie de la mesa donde ocurre todo el juego
  NAMI_Z: 2.0,               // Posición de Nami a lo largo del carril
  SPAWN_Z: -30,            // Dónde aparecen los obstáculos (lejos de Nami)
  LEAK_DISTANCE: 1.0,      // A qué distancia de Nami cuenta un bicho como "llegó"
  ATTACK_RANGE: 2.8,       // Alcance del manotazo
  ATTACK_DURATION: 0.30,   // Duración de la animación del manotazo
  ATTACK_COOLDOWN: 0.38,   // Tiempo mínimo entre manotazos
  JUMP_VELOCITY: 9.5,      // Fuerza del salto
  GRAVITY: 26,
  ROCK_HALF_DEPTH: 0.55,   // Mitad de la "profundidad" de colisión de la piedra
  ROCK_HEIGHT: 0.7,        // Altura de colisión de la piedra (hay que superarla saltando)
};

// 🎥 Cámara
const CAMERA = { position: [0, 3.5, 6.5], lookAt: [0, 1.0, -2], fov: 60 };

/* 📦 Modelos .glb
   file         → ruta del archivo
   scale        → multiplicador de escala (1 = tamaño automático según fitHeight)
   fitHeight    → altura en unidades a la que se ajusta el modelo automáticamente (null = tamaño original)
   position     → desplazamiento [x, y, z] extra para ajustar el modelo
   rotationY    → giro en radianes (Nami debe mirar hacia -Z; los bichos hacia +Z)
   placeholderScale → escala de la figura de respaldo si el .glb no existe
   Los escenarios (habitacion, sala, cocina) NO se autoajustan: mueve position[1] hasta que la superficie
   de la mesa quede en y = CONFIG.SURFACE_Y (tecla H = guía del carril y ejes). */
const MODELS = {
  nami:       { file: 'modelos/nami.glb',            scale: 1, fitHeight: 1.4,  position: [0.5, 0, 0.5], rotationY: Math.PI, placeholderScale: 1 },
  habitacion: { file: 'modelos/habitacion_mesa.glb', scale: 1, fitHeight: null, position: [0.9, 0, 0], rotationY: Math.PI/2,       placeholderScale: 1, scenery: true },
  sala:       { file: 'modelos/sala_mesa.glb',       scale: 1, fitHeight: null, position: [0.9, -1.5, 0], rotationY: 0,       placeholderScale: 1, scenery: true },
  cochinilla: { file: 'modelos/cochinilla.glb',      scale: 1, fitHeight: 0.45, position: [0, 0, 0], rotationY: 0,       placeholderScale: 1 },
  arana:      { file: 'modelos/arana.glb',           scale: 1, fitHeight: 0.40, position: [0, 0, 0], rotationY: 0,       placeholderScale: 1 },
  cocina:     { file: 'modelos/cocina_mesa.glb',      scale: 1, fitHeight: null, position: [0, 0, 0], rotationY: Math.PI/2,       placeholderScale: 1, scenery: true },
  caracol:    { file: 'modelos/caracoles.glb',       scale: 1, fitHeight: 0.60, position: [0, 0, 0], rotationY: Math.PI,       placeholderScale: 1 },
  piedra:     { file: 'modelos/piedra.glb',          scale: 1, fitHeight: CONFIG.ROCK_HEIGHT, position: [0, 0, 0], rotationY: 0, placeholderScale: 1 },
  mora:       { file: 'modelos/mora.glb',            scale: 1, fitHeight: 0.4,  position: [0, 0, 0], rotationY: Math.PI,       placeholderScale: 1 },
};

/* 🗺 Niveles */
const LEVELS = [
  { num: 1, name: 'La mesa de la habitación', room: 'habitacion', enemy: 'cochinilla', enemyPlural: 'cochinillas',
    burst: 0xc9ced8, wobble: 'hop', surviveSeconds: SURVIVE_SECONDS_NIVEL_1,
    spawnZ: NIVEL_1.SPAWN_Z ?? CONFIG.SPAWN_Z, attackRange: NIVEL_1.ATTACK_RANGE ?? CONFIG.ATTACK_RANGE, enemyHits: NIVEL_1.ENEMY_HITS ?? 1, knockback: NIVEL_1.KNOCKBACK ?? 0,
    enemySpeed: NIVEL_1.ENEMY_SPEED, rockSpeed: NIVEL_1.ROCK_SPEED, spawnMin: NIVEL_1.SPAWN_MIN, spawnMax: NIVEL_1.SPAWN_MAX,
    rockChance: NIVEL_1.ROCK_CHANCE, maxLeaks: NIVEL_1.MAX_LEAKS,
    intro: 'Cochinillas en la mesa',
    winText: 'Nami ya se siente más segura en su nuevo hogar.' },
  { num: 2, name: 'La mesa de la sala', room: 'sala', enemy: 'arana', enemyPlural: 'arañas',
    burst: 0x7a5640, wobble: 'scuttle', surviveSeconds: SURVIVE_SECONDS_NIVEL_2,
    spawnZ: NIVEL_2.SPAWN_Z ?? CONFIG.SPAWN_Z, attackRange: NIVEL_2.ATTACK_RANGE ?? CONFIG.ATTACK_RANGE, enemyHits: NIVEL_2.ENEMY_HITS ?? 1, knockback: NIVEL_2.KNOCKBACK ?? 0,
    enemySpeed: NIVEL_2.ENEMY_SPEED, rockSpeed: NIVEL_2.ROCK_SPEED, spawnMin: NIVEL_2.SPAWN_MIN, spawnMax: NIVEL_2.SPAWN_MAX,
    rockChance: NIVEL_2.ROCK_CHANCE, maxLeaks: NIVEL_2.MAX_LEAKS,
    intro: 'Las arañas son más rápidas',
    winText: 'Nami ya conoce la sala y las arañas no volverán a asustarla.' },
  { num: 3, name: 'La mesa de la cocina', room: 'cocina', enemy: 'caracol', enemyPlural: 'caracoles',
    burst: 0xb58a5a, wobble: 'slither', surviveSeconds: SURVIVE_SECONDS_NIVEL_3,
    spawnZ: NIVEL_3.SPAWN_Z ?? CONFIG.SPAWN_Z, attackRange: NIVEL_3.ATTACK_RANGE ?? CONFIG.ATTACK_RANGE, enemyHits: NIVEL_3.ENEMY_HITS ?? 1, knockback: NIVEL_3.KNOCKBACK ?? 0,
    enemySpeed: NIVEL_3.ENEMY_SPEED, rockSpeed: NIVEL_3.ROCK_SPEED, spawnMin: NIVEL_3.SPAWN_MIN, spawnMax: NIVEL_3.SPAWN_MAX,
    rockChance: NIVEL_3.ROCK_CHANCE, maxLeaks: NIVEL_3.MAX_LEAKS,
    intro: 'Los caracoles resisten dos golpes',
    winText: 'Nami ya domina toda la casa. ¡Su nuevo hogar es por fin suyo!' },
];

/* ═══════════════════════════════════════════════════════════════
   ▌ ESCENA BÁSICA
   ═══════════════════════════════════════════════════════════════ */
const S = CONFIG.SURFACE_Y;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2230);

const camera = new THREE.PerspectiveCamera(CAMERA.fov, innerWidth / innerHeight, 0.1, 200);
const camBase = new THREE.Vector3(...CAMERA.position);
camera.position.copy(camBase);
camera.lookAt(...CAMERA.lookAt);

scene.add(new THREE.HemisphereLight(0xfff3dc, 0x8a6a4a, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(4, 10, 6);
sun.target.position.set(0, 0, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 24, bottom: -24, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const berryLight = new THREE.PointLight(0x6f8bff, 0, 9);   // luz de la mora (0 hasta el final)
scene.add(berryLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ═══════════════════════════════════════════════════════════════
   ▌ PLACEHOLDERS (figuras de respaldo si falta un .glb)
   ═══════════════════════════════════════════════════════════════ */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
const shadowed = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; return m; };
const ellipsoid = (rx, ry, rz, m) => {
  const mesh = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), m));
  mesh.scale.set(rx, ry, rz);
  return mesh;
};

function buildNamiPlaceholder() {
  const g = new THREE.Group();
  const pot = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.34, 0.42, 24), mat(0xb8643c)));
  pot.position.y = 0.21; g.add(pot);
  const rim = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.48, 0.1, 24), mat(0xc4714a)));
  rim.position.y = 0.44; g.add(rim);
  const leafMat = mat(0x9cc9a0, { roughness: 1 });
  const body = ellipsoid(0.42, 0.5, 0.4, leafMat); body.position.y = 0.95; g.add(body);
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const leaf = ellipsoid(0.17, 0.34, 0.1, leafMat);
    leaf.position.set(Math.cos(a) * 0.3, 0.62, Math.sin(a) * 0.3);
    leaf.rotation.set(Math.sin(a) * 0.6, 0, -Math.cos(a) * 0.6);
    g.add(leaf);
    const tip = ellipsoid(0.07, 0.05, 0.05, mat(0x8a4b2d));
    tip.position.set(Math.cos(a) * 0.42, 0.88, Math.sin(a) * 0.42); g.add(tip);
  }
  for (const sx of [-1, 1]) {            // carita: Nami mira hacia -Z
    const eye = ellipsoid(0.065, 0.085, 0.05, mat(0x1c1b22, { roughness: 0.3 }));
    eye.position.set(sx * 0.16, 1.02, -0.36); g.add(eye);
    const glint = ellipsoid(0.02, 0.02, 0.02, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(sx * 0.16 - 0.02, 1.06, -0.405); g.add(glint);
    const cheek = ellipsoid(0.07, 0.04, 0.03, mat(0xf0a0a0));
    cheek.position.set(sx * 0.27, 0.93, -0.33); g.add(cheek);
  }
  g.userData.arms = [];                  // manitas con pivote
  for (const sx of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(sx * 0.4, 0.85, -0.1);
    const paw = ellipsoid(0.13, 0.13, 0.34, leafMat); paw.position.z = -0.3; pivot.add(paw);
    const claws = ellipsoid(0.09, 0.07, 0.07, mat(0x8a4b2d)); claws.position.z = -0.6; pivot.add(claws);
    g.add(pivot);
    g.userData.arms.push(pivot);
  }
  return g;
}

function buildCochinillaPlaceholder() {
  const g = new THREE.Group();
  const shell = mat(0x7d8591, { roughness: 0.45 });
  [0.19, 0.23, 0.25, 0.23, 0.18].forEach((r, i) => {
    const seg = ellipsoid(0.24, r * 0.95, 0.15, shell);
    seg.position.set(0, 0.2, -0.3 + i * 0.15);
    g.add(seg);
  });
  const head = ellipsoid(0.12, 0.1, 0.1, mat(0x5d636d)); head.position.set(0, 0.14, 0.52); g.add(head);
  for (const sx of [-1, 1]) {
    const eye = ellipsoid(0.03, 0.03, 0.03, new THREE.MeshBasicMaterial({ color: 0xff4d3d }));
    eye.position.set(sx * 0.07, 0.19, 0.6); g.add(eye);
    const ant = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.28, 5), mat(0x3a3d44)));
    ant.position.set(sx * 0.07, 0.22, 0.68); ant.rotation.x = 1.0; ant.rotation.z = -sx * 0.3; g.add(ant);
    for (let l = 0; l < 3; l++) {
      const leg = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 4), mat(0x3a3d44)));
      leg.position.set(sx * 0.24, 0.07, -0.1 + l * 0.25); leg.rotation.z = sx * 0.9; g.add(leg);
    }
  }
  return g;
}

function buildAranaPlaceholder() {      // mira hacia +Z, 8 patas animables
  const g = new THREE.Group();
  const dark = mat(0x2e2420, { roughness: 0.5 });
  const abdomen = ellipsoid(0.2, 0.18, 0.26, dark); abdomen.position.set(0, 0.22, -0.2); g.add(abdomen);
  const mark = ellipsoid(0.06, 0.02, 0.1, new THREE.MeshBasicMaterial({ color: 0xc0301f })); mark.position.set(0, 0.395, -0.2); g.add(mark);
  const head = ellipsoid(0.14, 0.12, 0.15, mat(0x3b2e28)); head.position.set(0, 0.2, 0.1); g.add(head);
  for (const [x, y, r] of [[-0.05, 0.25, 0.028], [0.05, 0.25, 0.028], [-0.09, 0.21, 0.02], [0.09, 0.21, 0.02]]) {
    const eye = ellipsoid(r, r, r, new THREE.MeshBasicMaterial({ color: 0xff3b2a }));
    eye.position.set(x, y, 0.23); g.add(eye);
  }
  const legMat = mat(0x1d1714);
  g.userData.legs = [];
  for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) {
    const pivot = new THREE.Group();
    pivot.position.set(sx * 0.1, 0.2, (i - 1.5) * 0.075);

const PLACEHOLDERS = {
  nami: buildNamiPlaceholder, cochinilla: buildCochinillaPlaceholder, arana: buildAranaPlaceholder, caracol: buildCaracolPlaceholder,
  piedra: buildPiedraPlaceholder, mora: buildMoraPlaceholder,

/* ═══════════════════════════════════════════════════════════════
   ▌ CARGA DE MODELOS (GLTFLoader + respaldo automático)
   ═══════════════════════════════════════════════════════════════ */
const templates = {};   // key → { make(): Object3D, placeholder: boolean }
const loader = new GLTFLoader();

function prepareGLB(gltf, cfg) {
  const inner = gltf.scene;
  inner.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  inner.rotation.y = cfg.rotationY || 0;
  inner.updateMatrixWorld(true);
  let s = 1;
  if (cfg.fitHeight) {
    const b = new THREE.Box3().setFromObject(inner);
    const h = b.max.y - b.min.y;
    if (h > 0) s = cfg.fitHeight / h;
  }
  inner.scale.setScalar(s * cfg.scale);
  inner.updateMatrixWorld(true);
  if (!cfg.scenery) {   // personajes y objetos: base en y=0 y centrados en x/z
    const b = new THREE.Box3().setFromObject(inner);
    const c = b.getCenter(new THREE.Vector3());
    inner.position.set(-c.x, -b.min.y, -c.z);
  }
  inner.position.x += cfg.position[0];
  inner.position.y += cfg.position[1];
  inner.position.z += cfg.position[2];
  const wrap = new THREE.Group();
  wrap.add(inner);
  return wrap;
}

async function loadModel(key) {
  const cfg = MODELS[key];
  try {
    const gltf = await loader.loadAsync(cfg.file);
    const prepared = prepareGLB(gltf, cfg);
    templates[key] = { placeholder: false, make: () => SkeletonUtils.clone(prepared) };
  } catch (err) {
    console.warn(`[Nami] No se pudo cargar ${cfg.file}; se usa un placeholder.`, err?.message || err);
    templates[key] = {
      placeholder: true,
      make: () => {
        const g = PLACEHOLDERS[key]();
        g.scale.multiplyScalar(cfg.placeholderScale);
        g.position.x += cfg.position[0]; g.position.y += cfg.position[1]; g.position.z += cfg.position[2];
        return g;
      },
    };
  }
}
const spawnModel = key => templates[key].make();

/* ═══════════════════════════════════════════════════════════════
   ▌ AUDIO (sintetizado, sin archivos)
   ═══════════════════════════════════════════════════════════════ */
let actx = null;
function beep(f0, dur = 0.1, type = 'square', vol = 0.05, f1 = f0) {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 30), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* audio opcional */ }
}
const sfx = {
  swing: () => beep(520, 0.12, 'sawtooth', 0.035, 180),
  squash: () => { beep(300, 0.1, 'square', 0.06, 90); beep(700, 0.06, 'triangle', 0.04, 900); },
  jump: () => beep(260, 0.18, 'sine', 0.08, 620),
  clank: () => { beep(900, 0.08, 'square', 0.06, 380); beep(1300, 0.05, 'triangle', 0.04, 700); },
  hurt: () => beep(180, 0.3, 'sawtooth', 0.07, 60),
  berry: () => [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.06), i * 90)),
  boom: () => beep(160, 0.6, 'sawtooth', 0.09, 30),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.07), i * 140)),
};

/* ═══════════════════════════════════════════════════════════════
   ▌ ESTADO DEL JUEGO
   ═══════════════════════════════════════════════════════════════ */
let state = 'loading';       // loading | menu | playing | finale | won | lost
let levelIndex = 0, level = LEVELS[0], selectedLevel = 0;
let elapsed = 0, time = 0, leaks = 0, kills = 0, spawnTimer = 1;
let lostAt = 0, wonAt = 0, shake = 0, lastTypes = [];
const entities = [];         // enemigos y piedras activos
const dying = [], particles = [], fxList = [];
let berry = null, finale = null, room = null, debugGroup = null;

const nami = { swingId: 0, y: 0, vy: 0, grounded: true, attackT: -1, cooldown: 0, hurt: 0, obj: null, anim: null, arms: null };

const $ = id => document.getElementById(id);
const el = { hud: $('hud'), kills: $('kills'), bar: $('barfill'), timeTxt: $('timeTxt'), leaks: [...document.querySelectorAll('#leaks i')],
  screen: $('screen'), screenTitle: $('screenTitle'), screenText: $('screenText'), keysBox: $('keysBox'), startBtn: $('startBtn'),
  status: $('status'), lostReason: $('lostReason'), banner: $('banner'), bannerTitle: $('bannerTitle'), bannerText: $('bannerText'),
  flash: $('flash'), levelPick: $('levelPick'), chips: [...document.querySelectorAll('.chip')],
  ltNum: $('ltNum'), ltName: $('ltName'), levelTitle: $('levelTitle') };

const rand = (a, b) => a + Math.random() * (b - a);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function flash(kind, ms = 120) {
  el.flash.className = kind;
  setTimeout(() => { el.flash.className = ''; }, ms);
}

/* Partículas y efectos */
const pGeo = new THREE.IcosahedronGeometry(0.06, 0);
function burst(pos, color, n = 12, speed = 3.2) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.copy(pos);
    const a = Math.random() * Math.PI * 2, up = rand(1, 3.5);
    particles.push({ m, v: new THREE.Vector3(Math.cos(a) * rand(.4, 1) * speed, up, Math.sin(a) * rand(.4, 1) * speed), life: rand(.45, .8), max: 0.8 });
    scene.add(m);
  }
}
function shockwave(pos) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64),
    new THREE.MeshBasicMaterial({ color: 0x7f9bff, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(pos.x, S + 0.05, pos.z);
  scene.add(ring);
  fxList.push({ m: ring, t: 0, dur: 0.8 });
}

/* ═══════════════════════════════════════════════════════════════
   ▌ ENTIDADES (kind: 'enemy' | 'piedra')
   ═══════════════════════════════════════════════════════════════ */
function spawn(kind) {
  const model = spawnModel(kind === 'piedra' ? 'piedra' : level.enemy);
  const holder = new THREE.Group();     // el holder se anima (aparición, correteo); el modelo queda intacto
  holder.add(model);
  holder.position.set(0, S, level.spawnZ);
  holder.scale.setScalar(0.01);
  scene.add(holder);
  entities.push({ kind, obj: holder, model, z: level.spawnZ, age: 0, hp: kind === 'enemy' ? level.enemyHits : 1, hitT: 0, lastSwing: -1,
    speed: kind === 'piedra' ? level.rockSpeed : level.enemySpeed });
}

// Evita que un objeto más veloz alcance a otro (y lo atraviese) antes de llegar a Nami
function wouldOverlap(speed) {
  for (const e of entities) {
    const dz = e.z - level.spawnZ;
    if (dz > 0 && speed > e.speed) {
      const catchZ = level.spawnZ + speed * dz / (speed - e.speed);
      if (catchZ < CONFIG.NAMI_Z + 1.2) return true;
    }
  }
  return false;
}

function spawnNext() {
  let kind = Math.random() < level.rockChance ? 'piedra' : 'enemy';
  if (lastTypes.length === 0) kind = 'enemy';                                        // la primera siempre es un bicho
  if (kind === 'piedra' && lastTypes[0] === 'piedra' && lastTypes[1] === 'piedra') kind = 'enemy';
  const speed = kind === 'piedra' ? level.rockSpeed : level.enemySpeed;
  if (wouldOverlap(speed)) { spawnTimer = 0.2; return; }                             // reintenta en un momento
  lastTypes.unshift(kind); lastTypes.length = Math.min(lastTypes.length, 3);
  spawn(kind);
  spawnTimer = rand(level.spawnMin, level.spawnMax) + (kind === 'piedra' ? 0.5 : 0);
}

function removeEntity(e) {
  scene.remove(e.obj);
  const i = entities.indexOf(e); if (i >= 0) entities.splice(i, 1);
}

function squashEntity(e, color = level.burst, withSound = true) {
  const p = e.obj.position.clone(); p.y += 0.25;
  burst(p, color, 14);
  const i = entities.indexOf(e); if (i >= 0) entities.splice(i, 1);
  dying.push({ obj: e.obj, t: 0 });
  if (withSound) sfx.squash();
}

const attackActive = () => nami.attackT >= 0.04 && nami.attackT <= CONFIG.ATTACK_DURATION * 0.75;

function updateEntities(dt) {
  const nz = CONFIG.NAMI_Z;
  for (const e of [...entities]) {
    e.age += dt;
    e.z += e.speed * dt;
    e.obj.position.z = e.z;
    e.hitT = Math.max(0, e.hitT - dt);
    {
      const sc = Math.min(1, easeOutBack(Math.min(e.age / 0.4, 1)) || 0.01);       // aparición
      const pulse = Math.sin(Math.min(e.hitT / 0.25, 1) * Math.PI);                 // sacudida al recibir un golpe
      const sl = level.wobble === 'slither' && e.kind === 'enemy' ? Math.sin(e.age * 5) : 0;   // se arrastra
      e.obj.scale.set(sc * (1 + pulse * 0.25), sc * (1 - pulse * 0.3 - sl * 0.04), sc * (1 + pulse * 0.2 + sl * 0.06));
    }

    if (e.kind === 'enemy') {                 // animación de caminar
      if (level.wobble === 'scuttle') {
        e.obj.position.x = Math.sin(e.age * 9) * 0.07;
        e.obj.rotation.z = Math.sin(e.age * 30) * 0.05;
        const legs = e.model.userData.legs;
        if (legs) for (const l of legs) l.pivot.rotation.y = l.base + Math.sin(e.age * 34 + l.phase) * 0.35;
      } else if (level.wobble === 'slither') {
        e.obj.position.y = S;
        e.obj.rotation.z = Math.sin(e.age * 3.5) * 0.04;
        const st = e.model.userData.stalks;
        if (st) st.forEach((p, i) => { p.rotation.z = Math.sin(e.age * 6 + i * 2) * 0.25; });
      } else {
        e.obj.position.y = S + Math.abs(Math.sin(e.age * 16)) * 0.04;
        e.obj.rotation.z = Math.sin(e.age * 14) * 0.07;
      }
    }

    if (state === 'playing') {
      if (e.kind === 'enemy') {
        if (attackActive() && e.lastSwing !== nami.swingId && e.z >= nz - level.attackRange && e.z <= nz - CONFIG.LEAK_DISTANCE + 0.4) {
          e.lastSwing = nami.swingId;                       // cada manotazo cuenta una sola vez por enemigo
          e.hp--;
          if (e.hp <= 0) { kills++; el.kills.textContent = kills; squashEntity(e); continue; }
          // golpe que no elimina: el enemigo se sacude, retrocede y su concha se oscurece
          e.hitT = 0.25;
          e.z -= level.knockback; e.obj.position.z = e.z;
          const sm = e.model.userData.shellMat; if (sm) sm.color.setHex(0x5a3a22);
          const hp = e.obj.position.clone(); hp.y += 0.4;
          burst(hp, level.burst, 8, 2.2); sfx.clank();
        }
        if (e.z >= nz - CONFIG.LEAK_DISTANCE) {            // se acercó demasiado a Nami
          leaks++;
          el.leaks.forEach((d, i) => d.classList.toggle('full', i < leaks));
          const p = e.obj.position.clone(); p.y += 0.4;
          burst(p, 0xe0483c, 10, 2.5);
          removeEntity(e);
          nami.hurt = 1; shake = 0.5; flash('hit'); sfx.hurt();
          if (leaks >= level.maxLeaks) { gameOver(`Tres ${level.enemyPlural} llegaron hasta Nami.`); return; }
          continue;
        }
      } else if (Math.abs(e.z - nz) < CONFIG.ROCK_HALF_DEPTH && nami.y < CONFIG.ROCK_HEIGHT) {
        gameOver('Nami chocó con una piedra. ¡Salta con ↑!');
        return;
      }
    } else if (state === 'finale' && e.z > nz - 0.6) {
      squashEntity(e, level.burst, false);                 // durante el final nada lastima a Nami
      continue;
    }
    if (e.z > 8) removeEntity(e);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ▌ NAMI: física y animación procedural
   ═══════════════════════════════════════════════════════════════ */
function jump() {
  if (!(state === 'playing' || state === 'finale') || !nami.grounded) return;
  nami.vy = CONFIG.JUMP_VELOCITY; nami.grounded = false; sfx.jump();
}
function attack() {
  if (!(state === 'playing' || state === 'finale') || nami.cooldown > 0) return;
  nami.attackT = 0; nami.cooldown = CONFIG.ATTACK_COOLDOWN; nami.swingId++;
  sfx.swing();
}

function updateNamiPhysics(dt) {
  if (!nami.grounded) {
    nami.vy -= CONFIG.GRAVITY * dt;
    nami.y += nami.vy * dt;
    if (nami.y <= 0) { nami.y = 0; nami.vy = 0; nami.grounded = true; }
  }
  nami.cooldown = Math.max(0, nami.cooldown - dt);
  if (nami.attackT >= 0) {
    nami.attackT += dt;
    if (nami.attackT >= CONFIG.ATTACK_DURATION) nami.attackT = -1;
  }
}

function animateNami(dt) {
  if (!nami.obj) return;
  nami.hurt = Math.max(0, nami.hurt - dt * 2.2);
  nami.obj.position.set(0, S + nami.y, CONFIG.NAMI_Z);
  const a = nami.anim;
  const running = (state === 'playing' || state === 'finale') && nami.grounded;
  let sx = 1, sy = 1, bob = 0, tilt = 0, lunge = 0, roll = 0;

  if (running) { bob = Math.abs(Math.sin(time * 11)) * 0.06; sy = 1 + Math.sin(time * 22) * 0.015; }
  else if (state === 'menu' || state === 'won') { bob = Math.abs(Math.sin(time * 4)) * (state === 'won' ? 0.18 : 0.04); }
  if (!nami.grounded) { const st = Math.min(Math.abs(nami.vy) / 9, 1); sy = 1 + st * 0.12; sx = 1 - st * 0.07; }

  if (nami.attackT >= 0) {
    const p = nami.attackT / CONFIG.ATTACK_DURATION;
    tilt = -0.45 * Math.sin(p * Math.PI);
    lunge = -0.28 * Math.sin(p * Math.PI);
    if (nami.arms) {
      const ang = p < 0.3 ? 1.1 * (p / 0.3) : 1.1 - 1.9 * ((p - 0.3) / 0.7);     // levanta y golpea
      nami.arms.forEach((arm, i) => { arm.rotation.x = ang; arm.rotation.z = (i === 0 ? 1 : -1) * 0.1; });
    }
  } else if (nami.arms) {
    nami.arms.forEach(arm => { arm.rotation.x = running ? Math.sin(time * 11) * 0.12 : 0; });
  }
  if (state === 'lost') { roll = Math.sin(time * 6) * 0.08; tilt = 0.25; }
  roll += Math.sin(time * 45) * 0.14 * nami.hurt;

  a.position.set(0, bob, lunge);
  a.scale.set(sx, sy, sx);
  a.rotation.set(tilt, 0, roll);
}

/* ═══════════════════════════════════════════════════════════════
   ▌ FINAL DE NIVEL (mora azul)
   ═══════════════════════════════════════════════════════════════ */
function startFinale() {
  state = 'finale';
  finale = { t: 0, phase: 'appear', throwT: 0, after: 0 };
  berry = new THREE.Group();
  berry.add(spawnModel('mora'));
  berry.position.set(0, S + 2.1, CONFIG.NAMI_Z - 0.15);
  berry.scale.setScalar(0.01);
  scene.add(berry);
  berryLight.intensity = 2.5;
  sfx.berry();
  el.timeTxt.textContent = '¡Mora!';
}

function updateFinale(dt) {
  const f = finale; f.t += dt;
  const hold = new THREE.Vector3(0, S + 2.1, CONFIG.NAMI_Z - 0.15);
  const target = new THREE.Vector3(0, S + 0.3, CONFIG.NAMI_Z - 16);

  if (f.phase === 'appear') {
    const p = Math.min(f.t / 0.8, 1);
    berry.scale.setScalar(Math.max(0.01, easeOutBack(p)) * 1.6);
    berry.position.copy(hold); berry.position.y += Math.sin(f.t * 5) * 0.06;
    berry.rotation.y += dt * 4;
    berryLight.position.copy(berry.position);
    if (f.t >= 1.2) { f.phase = 'throw'; f.throwT = 0; attack(); }
  } else if (f.phase === 'throw') {
    f.throwT += dt;
    const p = Math.min(f.throwT / 0.9, 1);
    berry.position.lerpVectors(hold, target, p);
    berry.position.y += Math.sin(p * Math.PI) * 1.8;
    berry.rotation.x -= dt * 12; berry.rotation.y += dt * 6;
    berryLight.position.copy(berry.position);
    if (p >= 1) {
      f.phase = 'boom'; f.after = 0;
      shockwave(target); sfx.boom(); flash('blue', 260); shake = 0.7;
      burst(target.clone().setY(S + 0.4), 0x7f9bff, 40, 6);
      for (const e of [...entities]) squashEntity(e, 0x9bb0ff, false);   // limpia la pantalla
      scene.remove(berry); berry = null;
      berryLight.intensity = 0;
    }
  } else if (f.phase === 'boom') {
    f.after += dt;
    if (f.after > 1.1) {
      f.phase = 'done'; state = 'won'; wonAt = performance.now();
      const next = LEVELS[levelIndex + 1];
      el.bannerTitle.textContent = `¡Nivel ${level.num} Completado!`;
      el.bannerText.textContent = level.winText + (next ? ` Enter o clic: Nivel ${next.num}.` : ' ¡Completaste el juego! Enter o clic para volver al Nivel 1.');
      el.banner.classList.remove('on'); void el.banner.offsetWidth; el.banner.classList.add('on');
      sfx.win();
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   ▌ NIVELES: escenario, inicio, reinicio, game over
   ═══════════════════════════════════════════════════════════════ */
function setRoom(idx) {
  if (room) scene.remove(room);
  room = spawnModel(LEVELS[idx].room);
  scene.add(room);
}

function clearWorld() {
  [...entities].forEach(removeEntity);
  dying.forEach(d => scene.remove(d.obj)); dying.length = 0;
  particles.forEach(p => { scene.remove(p.m); p.m.material.dispose(); }); particles.length = 0;
  fxList.forEach(f => { scene.remove(f.m); f.m.material.dispose(); f.m.geometry.dispose(); }); fxList.length = 0;
  if (berry) { scene.remove(berry); berry = null; }
  berryLight.intensity = 0;
}

function startLevel(idx) {
  levelIndex = idx; level = LEVELS[idx];
  setRoom(idx);
  clearWorld();
  elapsed = 0; leaks = 0; kills = 0; spawnTimer = 1.0; lastTypes = []; shake = 0; finale = null;
  Object.assign(nami, { y: 0, vy: 0, grounded: true, attackT: -1, cooldown: 0, hurt: 0 });
  el.kills.textContent = '0';
  el.leaks.forEach((d, i) => { d.classList.remove('full'); d.parentElement.style.display = ''; d.style.display = i < level.maxLeaks ? '' : 'none'; });
  el.bar.style.width = '0%';
  el.timeTxt.textContent = level.surviveSeconds + ' s';
  el.banner.classList.remove('on');
  el.screen.classList.remove('on');
  el.hud.classList.add('on');
  el.lostReason.textContent = '';
  // título del nivel (reinicia la animación)
  el.ltNum.textContent = `Nivel ${level.num} · ${level.intro}`; el.ltName.textContent = level.name;
  el.levelTitle.classList.remove('on'); void el.levelTitle.offsetWidth; el.levelTitle.classList.add('on');
  state = 'playing';
}

function gameOver(reason) {
  state = 'lost'; lostAt = performance.now();
  shake = 0.6; flash('hit', 250); sfx.hurt();
  el.lostReason.textContent = reason;
  el.screenTitle.innerHTML = `<small>Game Over · Nivel ${level.num}</small>¡Auch!`;
  el.screenText.textContent = 'Nami necesita otro intento para defender su nuevo hogar.';
  el.keysBox.style.display = 'none'; el.levelPick.style.display = 'none';
  el.startBtn.textContent = 'Reintentar';
  setTimeout(() => { if (state === 'lost') el.screen.classList.add('on'); }, 700);
}

function selectLevel(i) {
  selectedLevel = i;
  el.chips.forEach((c, k) => c.classList.toggle('on', k === i));
  setRoom(i);                          // vista previa del escenario detrás del menú
}

function tryStart() {
  const now = performance.now();
  if (state === 'menu') startLevel(selectedLevel);
  else if (state === 'lost' && now - lostAt > 900) startLevel(levelIndex);
  else if (state === 'won' && now - wonAt > 900) startLevel(LEVELS[levelIndex + 1] ? levelIndex + 1 : 0);
}

/* ═══════════════════════════════════════════════════════════════
   ▌ ENTRADA
   ═══════════════════════════════════════════════════════════════ */
addEventListener('keydown', e => {
  if (e.repeat && e.code !== 'ArrowUp') return;
  if (e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  else if (e.code === 'Space') { e.preventDefault(); if (state === 'playing' || state === 'finale') attack(); else tryStart(); }
  else if (e.code === 'Enter' || e.code === 'KeyR') tryStart();
  else if (e.code === 'KeyH') toggleDebug();
  else if (state === 'menu' && /^Digit[1-3]$/.test(e.code)) selectLevel(Number(e.code.slice(-1)) - 1);
});
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (state === 'won') tryStart(); else attack();
});
el.screen.addEventListener('pointerdown', () => tryStart());
el.chips.forEach((c, i) => c.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectLevel(i); }));
let touchY = null;                       // táctil: deslizar hacia arriba = saltar
renderer.domElement.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
renderer.domElement.addEventListener('touchend', e => {
  if (touchY !== null && touchY - e.changedTouches[0].clientY > 40) jump();
  touchY = null;
}, { passive: true });

function toggleDebug() {
  if (debugGroup) { const wasOn = debugGroup.visible; scene.remove(debugGroup); debugGroup = null; if (wasOn) return; }
  if (!debugGroup) {
    debugGroup = new THREE.Group();
    const lane = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 40), new THREE.MeshBasicMaterial({ color: 0x6dff9a, transparent: true, opacity: 0.35, depthWrite: false }));
    lane.rotation.x = -Math.PI / 2; lane.position.set(0, S + 0.02, -20 + CONFIG.NAMI_Z);
    const zone = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, level.attackRange - CONFIG.LEAK_DISTANCE),
      new THREE.MeshBasicMaterial({ color: 0xffd34d, wireframe: true }));
    zone.position.set(0, S + 0.25, CONFIG.NAMI_Z - (level.attackRange + CONFIG.LEAK_DISTANCE) / 2);
    debugGroup.add(lane, zone, new THREE.AxesHelper(2));
    debugGroup.visible = false; scene.add(debugGroup);
  }
  debugGroup.visible = !debugGroup.visible;
}

/* ═══════════════════════════════════════════════════════════════
   ▌ BUCLE PRINCIPAL
   ═══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function update(dt) {
  time += dt;
  const active = state === 'playing' || state === 'finale';

  if (state === 'playing') {
    elapsed += dt;
    if (elapsed >= level.surviveSeconds) { elapsed = level.surviveSeconds; startFinale(); }
    else {
      spawnTimer -= dt;
      if (spawnTimer <= 0) spawnNext();
      el.timeTxt.textContent = Math.ceil(level.surviveSeconds - elapsed) + ' s';
    }
    el.bar.style.width = (elapsed / level.surviveSeconds * 100) + '%';
  }
  if (active) {
    updateNamiPhysics(dt);
    updateEntities(dt);
    if (state === 'finale') updateFinale(dt);
  }
  animateNami(dt);

  for (let i = dying.length - 1; i >= 0; i--) {         // bichos aplastados
    const d = dying[i]; d.t += dt;
    const p = Math.min(d.t / 0.25, 1);
    d.obj.scale.set(1 + p * 0.5, Math.max(0.05, 1 - p * 0.95), 1 + p * 0.5);
    if (p >= 1) { scene.remove(d.obj); dying.splice(i, 1); }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.material.opacity = Math.max(0, p.life / p.max);
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); }
  }
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i]; f.t += dt;
    const p = f.t / f.dur;
    f.m.scale.setScalar(1 + p * 30);
    f.m.material.opacity = Math.max(0, 0.9 * (1 - p));
    if (p >= 1) { scene.remove(f.m); f.m.material.dispose(); f.m.geometry.dispose(); fxList.splice(i, 1); }
  }

  shake = Math.max(0, shake - dt * 1.6);
  camera.position.set(camBase.x + (Math.random() - .5) * shake * 0.35, camBase.y + (Math.random() - .5) * shake * 0.35, camBase.z);
  camera.lookAt(...CAMERA.lookAt);
}

function loop() {
  requestAnimationFrame(loop);
  update(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════════
   ▌ ARRANQUE  (tip: abre index.html?nivel=2 para entrar directo al Nivel 2)
   ═══════════════════════════════════════════════════════════════ */
(async function init() {
  await Promise.all(Object.keys(MODELS).map(loadModel));

  nami.obj = new THREE.Group();
  nami.anim = new THREE.Group();
  const namiModel = spawnModel('nami');
  nami.anim.add(namiModel);
  nami.obj.add(nami.anim);
  nami.arms = namiModel.userData.arms || null;
  scene.add(nami.obj);

  const names = { nami: 'Nami', habitacion: 'Habitación', sala: 'Sala', cocina: 'Cocina', cochinilla: 'Cochinilla', arana: 'Araña', caracol: 'Caracol', piedra: 'Piedra', mora: 'Mora' };
  el.status.innerHTML = 'Modelos: ' + Object.keys(MODELS).map(k =>
    templates[k].placeholder ? `<s>${names[k]} (respaldo)</s>` : `<b>${names[k]} ✓</b>`).join(' · ')
    + (Object.values(templates).every(t => t.placeholder)
      ? '<br>Si ya pusiste tus .glb en modelos/ y no aparecen, abre el juego con un servidor local (por ejemplo: python -m http.server).' : '');

  const fromUrl = Number(new URLSearchParams(location.search).get('nivel'));
  selectLevel(fromUrl >= 1 && fromUrl <= LEVELS.length ? fromUrl - 1 : 0);

  el.screenText.textContent = 'Nami está estrenando casa. Defiéndela de los bichos con tus manitas y salta las piedras.';
  el.keysBox.style.display = 'grid';
  el.levelPick.style.display = 'flex';
  el.startBtn.disabled = false;
  el.startBtn.textContent = 'Empezar';
  state = 'menu';
  loop();
})();
</script>
</body>
